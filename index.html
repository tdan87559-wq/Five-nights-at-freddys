<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Nights at Freddy's - מערכת אבטחה</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #070709;
            color: #e4e4e7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 30px 15px;
        }
        h1 {
            color: #dc2626;
            font-size: 2.8em;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(220, 38, 38, 0.8);
            margin-bottom: 5px;
        }
        .subtitle { color: #a1a1aa; margin-bottom: 25px; }
        .monitor {
            background: repeating-linear-gradient(0deg, #121215, #121215 2px, #18181b 2px, #18181b 4px);
            border: 3px solid #3f3f46;
            border-radius: 14px;
            max-width: 750px;
            margin: 0 auto;
            padding: 25px;
            box-shadow: 0 0 35px rgba(220, 38, 38, 0.25);
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #27272a;
            padding-bottom: 12px;
            margin-bottom: 20px;
            font-family: monospace;
            font-size: 1.1em;
        }
        .rec { color: #ef4444; font-weight: bold; animation: blink 1.2s infinite; }
        .battery { color: #22c55e; font-weight: bold; }
        @keyframes blink { 50% { opacity: 0.2; } }
        .screen {
            background: #09090b;
            border: 1px solid #27272a;
            border-radius: 8px;
            padding: 30px 20px;
            min-height: 180px;
            margin-bottom: 20px;
        }
        .screen h2 { color: #facc15; margin-bottom: 10px; font-size: 1.6em; }
        .screen p { color: #d4d4d8; font-size: 1.15em; line-height: 1.6; }
        .cam-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        button {
            background: #27272a;
            color: #fff;
            border: 2px solid #52525b;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover, button.active {
            background: #22c55e;
            color: #000;
            border-color: #22c55e;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.6);
        }
    </style>
</head>
<body>

    <h1>FIVE NIGHTS AT FREDDY'S</h1>
    <div class="subtitle">מערכת מצלמות האבטחה של פיצריית פרדי פאזבר</div>

    <div class="monitor">
        <div class="top-bar">
            <span class="rec">● REC LIVE</span>
            <span id="cam-label" style="color:#fff;">CAM 01 - הבמה המרכזית</span>
            <span class="battery">סוללה: 84% 🔋</span>
        </div>

        <div class="screen" id="cam-screen">
            <h2>🎤 הבמה המרכזית (Show Stage)</h2>
            <p>פרדי, בוני וצ'יקה עומדים על הבמה. כרגע הכול נראה שקט... אבל אל תוריד מהם את העיניים.</p>
        </div>

        <div class="cam-buttons">
            <button class="active" onclick="switchCam(1, this)">CAM 01 - הבמה</button>
            <button onclick="switchCam(2, this)">CAM 02 - מפרץ הפיראטים</button>
            <button onclick="switchCam(3, this)">CAM 03 - המסדרון המערבי</button>
            <button onclick="switchCam(4, this)">CAM 04 - המטבח (שמע בלבד)</button>
        </div>
    </div>

    <script>
        const cams = {
            1: { label: "CAM 01 - הבמה המרכזית", title: "🎤 הבמה המרכזית (Show Stage)", text: "פרדי, בוני וצ'יקה עומדים על הבמה. כרגע הכול נראה שקט... אבל אל תוריד מהם את העיניים." },
            2: { label: "CAM 02 - מפרץ הפיראטים", title: "🏴‍☠️ מפרץ הפיראטים (Pirate Cove)", text: "הווילון הסגול סגור למחצה. פוקסי מציץ מבפנים — אם לא תבדוק אותו מספיק, הוא ירוץ למסדרון!" },
            3: { label: "CAM 03 - המסדרון המערבי", title: "🔦 המסדרון המערבי (West Hall)", text: "אזהרה! זוהתה תנועה מהירה במסדרון לכיוון משרד האבטחה. התכונן לסגור את הדלת השמאלית!" },
            4: { label: "CAM 04 - המטבח", title: "🍕 המטבח (Kitchen - Audio Only)", text: "המצלמה מושבתת. נשמעים רעשים של סירים ומחבתות... צ'יקה נמצאת בפנים." }
        };

        function switchCam(num, btn) {
            document.getElementById('cam-label').innerText = cams[num].label;
            document.getElementById('cam-screen').innerHTML = `<h2>${cams[num].title}</h2><p>${cams[num].text}</p>`;
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>

</body>
</html>
